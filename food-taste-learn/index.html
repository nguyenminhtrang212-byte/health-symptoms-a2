<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food: nghe viết, đọc hiểu, nói</title>
<style>
  :root { --bg:#f6f7f2; --card:#fff; --ink:#1f2a1f; --mut:#5d695f; --g:#2e7d32; --lg:#e8f3e8; --o:#b26a00; --lo:#fff1dc; --r:#c62828; --lr:#fdeaea; --line:#dfe5da; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14201a; --card:#1d2d24; --ink:#eaf2ea; --mut:#a9b8ac; --g:#7bd17f; --lg:#24382b; --o:#f0b45a; --lo:#3a2f1c; --r:#ff8a80; --lr:#3b2323; --line:#33463a; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
  .wrap { max-width:720px; margin:0 auto; padding:14px 14px 80px; }
  h1 { font-size:1.35rem; margin:8px 0 2px; }
  .sub, .vi { color:var(--mut); font-size:.9rem; }
  .bar { position:sticky; top:0; background:var(--bg); padding:8px 0; z-index:5; }
  .pbar { height:10px; background:var(--line); border-radius:99px; overflow:hidden; }
  .pbar i { display:block; height:100%; width:0; background:var(--g); transition:width .3s; }
  .ptxt { font-size:.85rem; color:var(--mut); margin:4px 0; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .chip { border:2px solid var(--line); background:var(--card); color:var(--ink); border-radius:99px; padding:5px 12px; font:inherit; font-size:.88rem; cursor:pointer; }
  .chip.on { border-color:var(--g); background:var(--lg); font-weight:700; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:12px; }
  h2 { font-size:1.12rem; margin:0 0 6px; }
  input[type=text], textarea { width:100%; font:inherit; padding:10px 12px; border:2px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); }
  textarea { min-height:70px; }
  input:focus, textarea:focus { outline:none; border-color:var(--g); }
  button { font:inherit; cursor:pointer; }
  .primary { background:var(--g); color:#fff; border:0; padding:11px 20px; border-radius:12px; font-weight:700; }
  .primary:disabled { opacity:.45; cursor:default; }
  .ghost { background:transparent; border:2px solid var(--line); color:var(--ink); padding:9px 16px; border-radius:12px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .play { display:flex; gap:10px; justify-content:center; margin:14px 0; }
  .play button { font-size:1.05rem; }
  .big { font-size:2.2rem; text-align:center; }
  .fb { margin-top:10px; padding:10px 12px; border-radius:10px; font-size:.95rem; }
  .fb.ok { background:var(--lg); color:var(--g); } .fb.no { background:var(--lr); color:var(--r); } .fb.hint { background:var(--lo); color:var(--o); }
  .tip { background:var(--lo); border-radius:10px; padding:10px 12px; margin:10px 0; font-size:.92rem; }
  .passage { font-size:1.05rem; line-height:1.7; }
  .opt { display:block; width:100%; text-align:left; margin:6px 0; padding:10px 12px; border:2px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; }
  .opt.sel { border-color:var(--g); background:var(--lg); }
  .opt.good { border-color:var(--g); background:var(--lg); } .opt.bad { border-color:var(--r); background:var(--lr); }
  .rec { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .rec.live button.r { background:var(--r); color:#fff; border-color:var(--r); }
  .done { color:var(--g); font-weight:700; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:20; }
  .modal .box { background:var(--card); border-radius:14px; padding:18px; max-width:420px; }
  .hidden, .modal.hidden { display:none !important; }
  ul.ph { padding-left:20px; margin:6px 0; font-size:.92rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Food: nghe viết, đọc hiểu, nói</h1>
  <p class="sub">3 phần: ① Nghe và viết lại từ · ② Bài đọc về đồ ăn · ③ Nói: trả lời 3 câu hỏi. Làm xong phần trước mới mở phần sau.</p>
  <div class="card">
    <label class="vi">Tên em (bắt buộc, để cô biết bài của em)</label>
    <input type="text" id="name" placeholder="Nguyễn Văn A">
  </div>
  <div class="bar"><div class="pbar"><i id="pbar"></i></div><div class="ptxt" id="ptxt"></div><div class="chips" id="chips"></div></div>
  <div id="main"></div>
</div>
<div class="modal hidden" id="modal"><div class="box"><p id="mtxt"></p><div class="row"><span></span><button class="primary" id="mok">Đã hiểu</button></div></div></div>

<script>
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwHIIHnQWgc7rSRzIV8EeX0Y7PobNi8_Kbl9ybE47lxbTn_Z5ecoRcDctajXzLGYIk/exec";
var LESSON = "Food - Nghe viet, Doc, Noi";
var KEY = "food-listen-read-speak-v1";

/* ① Nghe và viết: từ dễ đến khó */
var DICT = [
 {w:"apple",ipa:"/ˈæpl/",vi:"quả táo"},
 {w:"milk",ipa:"/mɪlk/",vi:"sữa"},
 {w:"bread",ipa:"/bred/",vi:"bánh mì"},
 {w:"sweet",ipa:"/swiːt/",vi:"ngọt"},
 {w:"chicken",ipa:"/ˈtʃɪkɪn/",vi:"thịt gà"},
 {w:"sour",ipa:"/ˈsaʊə(r)/",vi:"chua"},
 {w:"chocolate",ipa:"/ˈtʃɒklət/",vi:"sô cô la"},
 {w:"spicy",ipa:"/ˈspaɪsi/",vi:"cay"},
 {w:"vegetables",ipa:"/ˈvedʒtəblz/",vi:"rau củ"},
 {w:"crunchy",ipa:"/ˈkrʌntʃi/",vi:"giòn"},
 {w:"delicious",ipa:"/dɪˈlɪʃəs/",vi:"ngon tuyệt"},
 {w:"ingredients",ipa:"/ɪnˈɡriːdiənts/",vi:"nguyên liệu"}
];

/* ② Bài đọc */
var PASSAGE_TITLE = "Sunday Lunch at My Grandmother's House";
var PASSAGE = [
 "Every Sunday, my family has lunch at my grandmother's house. My grandmother loves cooking, and she always uses fresh ingredients.",
 "Last Sunday, she made chicken soup with carrots and onions. It was hot and a little salty, and it smelled delicious. My mum brought a big salad with tomatoes and cucumbers. It was crunchy and fresh.",
 "For dessert, we had strawberries with sugar. They were very sweet, but my dad thought they were a little sour. I don't have a sweet tooth, so I only ate three.",
 "After lunch, my grandmother gave us green tea. It was bitter, but it was good for our stomachs. I love Sunday lunch because the food is healthy and the whole family is together."
];
var GLOSS = [["fresh","tươi"],["salty","mặn"],["crunchy","giòn"],["sweet tooth","người thích đồ ngọt"],["bitter","đắng"],["healthy","tốt cho sức khỏe"]];
var RQ = [
 {q:"Where does the family have lunch every Sunday?", o:["At a restaurant","At the grandmother's house","At school"], a:1, x:"Câu đầu: at my grandmother's house."},
 {q:"What was in the soup?", o:["Fish and rice","Chicken, carrots and onions","Beef and potatoes"], a:1, x:"Chicken soup with carrots and onions."},
 {q:"How was the salad?", o:["Crunchy and fresh","Hot and spicy","Sweet and sour"], a:0, x:"It was crunchy and fresh."},
 {q:"Why did the writer eat only three strawberries?", o:["They were too sour","There were no more","The writer doesn't have a sweet tooth"], a:2, x:"I don't have a sweet tooth, so I only ate three."},
 {q:"How was the green tea?", o:["Bitter but good for the stomach","Very sweet","Too hot to drink"], a:0, x:"It was bitter, but it was good for our stomachs."},
 {q:"Why does the writer love Sunday lunch?", o:["The food is cheap","The food is healthy and the family is together","There is a lot of dessert"], a:1, x:"Because the food is healthy and the whole family is together."}
];
var PASS_READ = 4; /* đúng ít nhất 4/6 */

/* ③ Nói */
var SPEAK = [
 {q:"Do you like cooking?", vi:"Em có thích nấu ăn không?",
  ph:["Yes, I do. I like cooking because ...","No, I don't. I'd rather eat than cook.","I can cook simple dishes like ... (fried rice, noodles, eggs).","I usually cook with my mum / by myself."]},
 {q:"Do you have a sweet tooth?", vi:"Em có thích đồ ngọt không?",
  ph:["Yes, I do. I love ... (cake, ice cream, chocolate).","No, I don't. I prefer salty / spicy food.","Sweet things are too sweet for me.","I eat sweets once or twice a week."]},
 {q:"Do you have a healthy diet?", vi:"Chế độ ăn của em có tốt cho sức khỏe không?",
  ph:["Yes, I think so. I eat a lot of fruit and vegetables.","Not really. I eat too much fast food / sugar.","I try to drink more water and eat less sugar.","I always have breakfast. It's good for me."]}
];

var S = {name:"", step:0, di:0, dfirst:[], dtry:0, rans:[], rscore:-1, sent:[], txt:[], tried:0};
var BLOBS = [], RECS = [], STREAM = null;
function $(id){ return document.getElementById(id); }
function load(){ try { var j = JSON.parse(localStorage.getItem(KEY)||"null"); if (j) for (var k in j) S[k] = j[k]; } catch(e){} }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function alertBox(t){ $("mtxt").textContent = t; $("modal").classList.remove("hidden"); }
$("mok").onclick = function(){ $("modal").classList.add("hidden"); };
function say(t, slow){ try { var u = new SpeechSynthesisUtterance(t); u.lang = "en-GB"; u.rate = slow ? .55 : .9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){} }

var STEPS = ["① Nghe và viết","② Bài đọc","③ Nói"];
function dictDone(){ return S.dfirst.length >= DICT.length; }
function readDone(){ return S.rscore >= PASS_READ; }
function speakDone(){ for (var i=0;i<SPEAK.length;i++) if (!S.sent[i]) return false; return true; }
function unlocked(i){ return i===0 || (i===1 && dictDone()) || (i===2 && dictDone() && readDone()); }
function pct(){
  var a = Math.min(S.dfirst.length/DICT.length,1), b = readDone()?1:0, c = 0;
  for (var i=0;i<SPEAK.length;i++) if (S.sent[i]) c++;
  return Math.round((a+b+c/SPEAK.length)/3*100);
}
function head(){
  $("pbar").style.width = pct()+"%";
  $("ptxt").textContent = "Hoàn thành " + pct() + "%";
  var c = $("chips"); c.innerHTML = "";
  STEPS.forEach(function(t,i){
    var b = document.createElement("button"); b.className = "chip" + (S.step===i?" on":"");
    var done = i===0?dictDone():i===1?readDone():speakDone();
    b.textContent = (done?"✅ ":(unlocked(i)?"":"🔒 ")) + t;
    b.onclick = function(){
      if (!unlocked(i)) { alertBox(i===1 ? "Hãy hoàn thành phần ① Nghe và viết trước nhé." : "Hãy hoàn thành phần ② Bài đọc (đúng ít nhất "+PASS_READ+"/"+RQ.length+") trước nhé."); return; }
      S.step = i; save(); render();
    };
    c.appendChild(b);
  });
}
function needName(){
  if (!($("name").value||"").trim()) { alertBox("Em hãy nhập tên trước khi làm bài."); $("name").focus(); return true; }
  return false;
}
function render(){ head(); [renderDict, renderRead, renderSpeak][S.step](); }

/* ===== ① ===== */
function renderDict(){
  var m = $("main");
  if (dictDone()) {
    var ok = S.dfirst.filter(Boolean).length;
    m.innerHTML = '<div class="card"><h2>① Nghe và viết: xong rồi!</h2><p>Em viết đúng ngay lần đầu <b>'+ok+'/'+DICT.length+'</b> từ.</p><div class="row"><button class="ghost" id="again">Làm lại từ đầu</button><button class="primary" id="go">Sang phần ② ▶</button></div></div>';
    $("go").onclick = function(){ S.step = 1; save(); render(); };
    $("again").onclick = function(){ S.di = 0; S.dfirst = []; S.dtry = 0; save(); render(); };
    return;
  }
  var d = DICT[S.di];
  m.innerHTML = '<div class="card"><h2>① Nghe và viết lại từ ('+(S.di+1)+'/'+DICT.length+')</h2><p class="vi">Bấm nghe, rồi gõ từ em nghe được. Từ dễ đến khó dần.</p>'+
    '<div class="play"><button class="primary" id="p1">🔊 Nghe</button><button class="ghost" id="p2">🐢 Nghe chậm</button></div>'+
    '<input type="text" id="ans" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Gõ từ em nghe được">'+
    '<div id="fb"></div><div class="row"><span class="vi">Em có thể nghe lại bao nhiêu lần cũng được</span><button class="primary" id="chk">Kiểm tra</button></div></div>';
  $("p1").onclick = function(){ say(d.w); }; $("p2").onclick = function(){ say(d.w, true); };
  var a = $("ans"); a.focus();
  function check(){
    var v = a.value.trim().toLowerCase(), fb = $("fb");
    if (!v) return;
    if (v === d.w) {
      if (S.dfirst.length === S.di) S.dfirst.push(S.dtry === 0);
      S.dtry = 0; save();
      fb.className = "fb ok"; fb.innerHTML = "✅ Đúng! <b>"+d.w+"</b> "+d.ipa+" = "+d.vi;
      $("chk").textContent = S.di === DICT.length-1 ? "Xem kết quả" : "Từ tiếp ▶";
      $("chk").onclick = function(){ S.di++; save(); render(); };
      a.disabled = true; say(d.w);
    } else {
      S.dtry++; save();
      fb.className = "fb no";
      var hint = S.dtry >= 2 ? '<br>Gợi ý: từ này có <b>'+d.w.length+'</b> chữ, bắt đầu bằng <b>'+d.w[0]+'</b>.' : "";
      if (S.dtry >= 4) hint += '<br>Đáp án: <b>'+d.w+'</b> '+d.ipa+' ('+d.vi+'). Em gõ lại để nhớ nhé.';
      fb.innerHTML = "Chưa đúng, em nghe lại nhé." + hint;
      a.select();
    }
  }
  $("chk").onclick = check;
  a.onkeydown = function(e){ if (e.key === "Enter") { if (a.disabled) $("chk").click(); else check(); } };
}

/* ===== ② ===== */
function renderRead(){
  var m = $("main"), h = '<div class="card"><h2>② Bài đọc: '+esc(PASSAGE_TITLE)+'</h2><div class="passage">';
  PASSAGE.forEach(function(p){ h += "<p>"+esc(p)+"</p>"; });
  h += '</div><div class="row"><button class="ghost" id="rd">🔊 Nghe cả bài</button></div><div class="tip"><b>Từ cần biết:</b> ' + GLOSS.map(function(g){ return "<b>"+g[0]+"</b> = "+g[1]; }).join(" · ") + '</div></div>';
  h += '<div class="card"><h2>Trả lời câu hỏi (đúng ít nhất '+PASS_READ+'/'+RQ.length+' để sang phần ③)</h2><div id="qs"></div><div class="row"><span id="sc" class="vi"></span><button class="primary" id="sub">Nộp phần đọc</button></div></div>';
  m.innerHTML = h;
  $("rd").onclick = function(){ say(PASSAGE.join(" ")); };
  var qs = $("qs"); var pick = {};
  RQ.forEach(function(q,i){
    var d = document.createElement("div"); d.style.marginTop = "12px";
    d.innerHTML = "<b>"+(i+1)+". "+esc(q.q)+"</b>";
    q.o.forEach(function(o,j){ var b = document.createElement("button"); b.className = "opt"; b.textContent = o; b.onclick = function(){ if (b.disabled) return; pick[i] = j; Array.prototype.forEach.call(d.querySelectorAll(".opt"), function(x,k){ x.classList.toggle("sel", k===j); }); }; d.appendChild(b); });
    var x = document.createElement("div"); x.className = "vi"; x.id = "x"+i; d.appendChild(x);
    qs.appendChild(d);
  });
  if (readDone()) $("sc").innerHTML = '<span class="done">✅ Em đã đạt '+S.rscore+'/'+RQ.length+'</span>';
  $("sub").onclick = function(){
    var miss = RQ.length - Object.keys(pick).length;
    if (miss) { alertBox("Em còn "+miss+" câu chưa chọn."); return; }
    var sc = 0;
    RQ.forEach(function(q,i){
      var ok = pick[i] === q.a; if (ok) sc++;
      var btns = qs.children[i].querySelectorAll(".opt");
      Array.prototype.forEach.call(btns, function(b,j){ b.disabled = true; b.classList.remove("sel"); if (j===q.a) b.classList.add("good"); else if (j===pick[i]) b.classList.add("bad"); });
      $("x"+i).textContent = (ok ? "✅ " : "❌ ") + q.x;
    });
    S.tried++; S.rans = RQ.map(function(q,i){ return pick[i]; });
    if (sc >= PASS_READ) { S.rscore = Math.max(S.rscore, sc); save(); head(); $("sc").innerHTML = '<span class="done">✅ '+sc+'/'+RQ.length+' · Đạt!</span>'; $("sub").textContent = "Sang phần ③ ▶"; $("sub").onclick = function(){ S.step = 2; save(); render(); }; }
    else { save(); $("sc").textContent = sc+"/"+RQ.length+" · chưa đạt, em đọc lại bài rồi làm lại nhé."; $("sub").textContent = "Làm lại"; $("sub").onclick = function(){ renderRead(); }; }
  };
}

/* ===== ③ ===== */
function renderSpeak(){
  var m = $("main"), h = '<div class="card"><h2>③ Nói: trả lời 3 câu hỏi</h2><p class="vi">Với mỗi câu: đọc câu hỏi, nói câu trả lời của em (2 đến 3 câu), nghe lại, rồi bấm gửi cho cô. Bấm ghi âm lần nữa để dừng.</p></div>';
  SPEAK.forEach(function(s,i){
    h += '<div class="card" id="sp'+i+'"><h2>'+(i+1)+'. '+esc(s.q)+' <button class="ghost" data-say="'+i+'">🔊</button></h2><div class="vi">'+esc(s.vi)+'</div>'+
      '<ul class="ph">'+s.ph.map(function(p){return "<li>"+esc(p)+"</li>";}).join("")+'</ul>'+
      '<div class="rec" id="rec'+i+'"><button class="ghost r" data-rec="'+i+'">🎙 Ghi âm</button><audio controls class="hidden" id="au'+i+'"></audio><button class="primary hidden" data-send="'+i+'">📤 Gửi cho cô</button><span id="st'+i+'" class="vi">'+(S.sent[i]?'<span class="done">✅ Đã gửi</span>':'')+'</span></div></div>';
  });
  h += '<div class="card"><h2>Nộp bài</h2><p class="vi">Gửi đủ 3 câu rồi bấm nộp để cô nhận tổng kết cả bài.</p><div class="row"><span id="fin" class="vi"></span><button class="primary" id="submit">Nộp bài cho cô</button></div></div>';
  m.innerHTML = h;
  Array.prototype.forEach.call(m.querySelectorAll("[data-say]"), function(b){ b.onclick = function(){ say(SPEAK[+b.dataset.say].q); }; });
  Array.prototype.forEach.call(m.querySelectorAll("[data-rec]"), function(b){ b.onclick = function(){ toggleRec(+b.dataset.rec, b); }; });
  Array.prototype.forEach.call(m.querySelectorAll("[data-send]"), function(b){ b.onclick = function(){ sendAudio(+b.dataset.send, b); }; });
  $("submit").onclick = submitAll;
}
function toggleRec(i, btn){
  if (needName()) return;
  var box = $("rec"+i);
  if (RECS[i] && RECS[i].state === "recording") { RECS[i].stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) { alertBox("Trình duyệt này không ghi âm được. Em hãy mở bằng Chrome hoặc Safari."); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var chunks = [], r = new MediaRecorder(stream); RECS[i] = r;
    r.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
    r.onstop = function(){
      stream.getTracks().forEach(function(t){ t.stop(); });
      var blob = new Blob(chunks, {type: r.mimeType || "audio/webm"}); BLOBS[i] = blob;
      var au = $("au"+i); au.src = URL.createObjectURL(blob); au.classList.remove("hidden");
      box.querySelector("[data-send]").classList.remove("hidden");
      box.classList.remove("live"); btn.textContent = "🎙 Ghi lại"; S.sent[i] = false; save(); $("st"+i).textContent = "Nghe lại, rồi bấm Gửi nhé."; head();
    };
    r.start(); box.classList.add("live"); btn.textContent = "⏹ Dừng";
  }).catch(function(){ alertBox("Em cần bấm Cho phép micro trên trình duyệt để ghi âm."); });
}
function blobToB64(b){ return new Promise(function(res, rej){ var f = new FileReader(); f.onload = function(){ res(String(f.result).split(",")[1]); }; f.onerror = rej; f.readAsDataURL(b); }); }
function post(o){ return fetch(SCRIPT_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(o)}).then(function(r){ return r.json(); }).then(function(j){ if (!j.ok) throw new Error(j.error||"error"); return j; }); }
function sendAudio(i, btn){
  if (!BLOBS[i]) return;
  var name = $("name").value.trim(); if (!name) { needName(); return; }
  btn.disabled = true; $("st"+i).textContent = "Đang gửi...";
  var mime = BLOBS[i].type || "audio/webm", ext = /mp4|aac/.test(mime) ? "m4a" : /ogg/.test(mime) ? "ogg" : "webm";
  blobToB64(BLOBS[i]).then(function(b64){
    return post({type:"audio", name:name, lesson:LESSON, file:"Noi_0"+(i+1)+"."+ext, audio:b64, mime:mime, label:"Nói câu "+(i+1)+": "+SPEAK[i].q, target:SPEAK[i].q, transcript:""});
  }).then(function(){ S.sent[i] = true; save(); $("st"+i).innerHTML = '<span class="done">✅ Đã gửi</span>'; btn.disabled = false; head(); })
   .catch(function(){ btn.disabled = false; $("st"+i).textContent = "Chưa gửi được, em kiểm tra mạng rồi bấm Gửi lại."; });
}
function submitAll(){
  var name = $("name").value.trim(); if (!name) { needName(); return; }
  if (!speakDone()) { alertBox("Em cần ghi âm và gửi đủ 3 câu trả lời trước khi nộp."); return; }
  var btn = $("submit"); btn.disabled = true; btn.textContent = "Đang gửi...";
  var ok = S.dfirst.filter(Boolean).length;
  var details = DICT.map(function(d,i){ return {part:"① Nghe viết", question:d.w, answer:S.dfirst[i]?"đúng ngay lần đầu":"cần nghe lại", correct:d.w, result:S.dfirst[i]?"đúng":"sai lần đầu"}; });
  details.push({part:"② Bài đọc", question:PASSAGE_TITLE, answer:S.rscore+"/"+RQ.length, correct:"", result:"đạt (cần "+PASS_READ+")"});
  SPEAK.forEach(function(s,i){ details.push({part:"③ Nói", question:s.q, answer:"đã gửi file ghi âm Noi_0"+(i+1), correct:"", result:"đã gửi"}); });
  post({type:"submit", name:name, lesson:LESSON, summary:{vocab:"Nghe viết đúng ngay lần đầu: "+ok+"/"+DICT.length, gram:"", ctx:"Bài đọc: "+S.rscore+"/"+RQ.length+" (làm "+S.tried+" lần)", rec:"Đã gửi "+SPEAK.length+" bản ghi âm", para:"", feedback:""}, details:details})
   .then(function(){ btn.textContent = "Đã nộp ✅"; alertBox("Em đã nộp bài thành công! Cô sẽ nghe và nhận xét."); })
   .catch(function(){ btn.disabled = false; btn.textContent = "Nộp bài cho cô"; alertBox("Chưa nộp được. Em kiểm tra mạng rồi bấm lại nhé."); });
}

load();
$("name").value = S.name || "";
$("name").oninput = function(){ S.name = this.value; save(); };
if (!unlocked(S.step)) S.step = 0;
render();
</script>
